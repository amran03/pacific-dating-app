name: pacific_dating_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # Fonts nzuri (Poppins) kupitia Google Fonts
  google_fonts: ^6.2.1

  # Kuhifadhi lugha iliyochaguliwa (EN/SW) ndani ya device
  shared_preferences: ^2.3.2

  # Supabase
  supabase_flutter: ^2.8.3

  # Media & permissions
  image_picker: ^1.1.2
  record: ^6.2.1
  audioplayers: ^6.0.0
  path_provider: ^2.1.4
  permission_handler: ^12.0.1

  # Location
  geolocator: ^13.0.2

  # Real (system) notifications
  flutter_local_notifications: ^17.2.3

  # Push delivery (background/killed) — Supabase-compatible via FCM data msgs
  firebase_core: ^3.8.0
  firebase_messaging: ^15.2.4

  # Real audio/video calls (WebRTC)
  flutter_webrtc: ^0.12.4
  webview_flutter: ^4.14.1
  zego_uikit_prebuilt_call: ^4.24.5
  # ZegoUIKitUser/ButtonIcon — direct import kwenye chat screen.
  zego_uikit: ^2.28.23
  # Call invitation signaling (direct dep — 1-on-1 voice/video invites)
  zego_uikit_signaling_plugin: ^2.8.22

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Kifurushi cha kutengeneza App Icon moja kwa moja
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/

# Usanidi wa App Icon (Weka picha yako kwenye assets/images/app_icon.png)
flutter_launcher_icons:
  image_path: "assets/images/app_icon.png"
  android: "launcher_icon"
  ios: true
  min_sdk_android: 21
